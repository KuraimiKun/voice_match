services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: random_voice_social
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d random_voice_social"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://app:app_password@postgres:5432/random_voice_social?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

  coturn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --lt-cred-mech
      - --user=dev:devpass
      - --realm=random-voice.local
      - --listening-port=3478
      - --fingerprint
      - --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    profiles:
      - turn

volumes:
  postgres_data:
  redis_data:
