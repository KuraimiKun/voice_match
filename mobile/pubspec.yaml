name: random_voice_social_app
description: Anonymous random audio chat with mutual-friend private rooms.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.2
  dio: ^5.4.2
  socket_io_client: ^2.0.3+1
  flutter_webrtc: ^0.10.8
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
